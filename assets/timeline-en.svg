<style>
  .st { fill:#fff; animation: tw 3s ease-in-out infinite; } @keyframes tw { 0%,100% { opacity:.12 } 50% { opacity:.85 } } .flame { animation: fl .12s linear infinite alternate; transform-origin: 0 13px; } @keyframes fl { from { transform: scaleY(.7) } to { transform: scaleY(1.15) } }
  .d { font: 600 14px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace; fill: #8b98ad } .r { font: 700 20px 'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #e6edf3 }
  .o { font: 600 15px 'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif } .k { font: 14px 'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #a9b4c6 }
  .tag { font: 700 12px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace; fill: #22d3ee; letter-spacing: 2px }
  .route { stroke-dasharray: 2 9; animation: flow 1s linear infinite; } @keyframes flow { to { stroke-dashoffset: -11 } }
  .it { opacity: 0; animation: in .7s ease-out forwards; }
  @keyframes in { from { opacity:0; transform: translateX(-14px) } to { opacity:1; transform: translateX(0) } }
  .ringp { transform-box: fill-box; transform-origin: center; animation: ring 2.4s ease-out infinite; }
  @keyframes ring { 0% { transform: scale(1); opacity:.7 } 100% { transform: scale(2.4); opacity:0 } }
  .spin { transform-box: fill-box; transform-origin: center; animation: sp 9s linear infinite; } @keyframes sp { to { transform: rotate(360deg) } }
  .travel { animation: tr 9s ease-in-out infinite; }
  @keyframes tr {
    0% { transform: translate(230px,296px) scale(.55); opacity:0 }
    8% { opacity:1 }
    30%,38% { transform: translate(230px,196px) scale(.55) }
    62%,70% { transform: translate(230px,96px) scale(.55) }
    80% { transform: translate(230px,26px) scale(.55); opacity:1 }
    86%,100% { transform: translate(230px,26px) scale(.55); opacity:0 }
  }
</style>

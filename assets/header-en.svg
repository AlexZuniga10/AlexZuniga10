<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Alex Javier Zuniga Flores">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f19"/><stop offset="1" stop-color="#151b2e"/></linearGradient>
  <linearGradient id="name" x1="0" x2="1">
    <stop offset="0" stop-color="#ff3b5c"><animate attributeName="stop-color" values="#ff3b5c;#a78bfa;#22d3ee;#ff3b5c" dur="8s" repeatCount="indefinite"/></stop>
    <stop offset="1" stop-color="#22d3ee"><animate attributeName="stop-color" values="#22d3ee;#ff3b5c;#a78bfa;#22d3ee" dur="8s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <radialGradient id="g1"><stop offset="0" stop-color="#ff3b5c" stop-opacity=".55"/><stop offset="1" stop-color="#ff3b5c" stop-opacity="0"/></radialGradient>
  <radialGradient id="g2"><stop offset="0" stop-color="#22d3ee" stop-opacity=".45"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <radialGradient id="g3"><stop offset="0" stop-color="#a78bfa" stop-opacity=".4"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
  <clipPath id="r"><rect width="1000" height="280" rx="18"/></clipPath>
  <clipPath id="reveal"><rect x="0" y="0" height="280" width="0"><animate attributeName="width" from="0" to="1000" dur="1.6s" begin=".3s" fill="freeze" calcMode="spline" keySplines=".2 .7 .2 1" keyTimes="0;1"/></rect></clipPath>
</defs>
<style>
  .sym { font: 600 20px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace; fill: #e6edf3; opacity: .0; animation: float 7s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); opacity:.10 } 50% { transform: translateY(-12px); opacity:.28 } }
  .sub { font: 500 19px 'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #e6edf3; opacity: 0; animation: up .9s 1.4s ease-out forwards; }
  .loc { font: 500 15px 'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #8b98ad; opacity: 0; animation: up .9s 1.9s ease-out forwards; }
  .bar { animation: grow 1.2s 1.1s ease-out both; transform-origin: 500px 0; }
  @keyframes up { from { opacity:0; transform: translateY(10px) } to { opacity:1; transform: translateY(0) } }
  @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
  .dot { animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
</style>
<g clip-path="url(#r)">
  <rect width="1000" height="280" fill="url(#bg)"/>
  <circle cx="150" cy="40" r="230" fill="url(#g1)"><animate attributeName="cx" values="150;260;150" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="40;90;40" dur="11s" repeatCount="indefinite"/></circle>
  <circle cx="860" cy="250" r="260" fill="url(#g2)"><animate attributeName="cx" values="860;740;860" dur="16s" repeatCount="indefinite"/><animate attributeName="cy" values="250;190;250" dur="12s" repeatCount="indefinite"/></circle>
  <circle cx="560" cy="-40" r="200" fill="url(#g3)"><animate attributeName="cx" values="560;440;560" dur="18s" repeatCount="indefinite"/></circle>
  <rect width="1000" height="280" fill="url(#grid)"/>
  <text class="sym" x="70" y="70" style="animation-delay:0s">&lt;/&gt;</text>
  <text class="sym" x="900" y="60" style="animation-delay:1.5s">{ }</text>
  <text class="sym" x="860" y="230" style="animation-delay:3s">SQL</text>
  <text class="sym" x="120" y="235" style="animation-delay:2.2s">$_</text>
  <text class="sym" x="940" y="160" style="animation-delay:4s">SSL</text>
  <text class="sym" x="40" y="160" style="animation-delay:3.6s">#!</text>
  <g clip-path="url(#reveal)"><text x="500" y="128" text-anchor="middle" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-1" fill="url(#name)">Alex Javier Zuniga Flores</text></g>
  <rect class="bar" x="420" y="150" width="160" height="4" rx="2" fill="url(#name)"/>
  <text class="sub" x="500" y="194" text-anchor="middle">Computer Engineer · Software Developer · Systems Administration</text>
  <g class="loc"><circle class="dot" cx="408" cy="227" r="5" fill="#3fb950"/><text x="422" y="232">Tegucigalpa, Honduras 🇭🇳</text></g>
  <rect x="1" y="1" width="998" height="278" rx="17" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
</g>
</svg>